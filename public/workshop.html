<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครเวิร์กช็อป — BARNBARN</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .prov-wrap { position: relative; }
    .prov-list {
      display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 30;
      max-height: 240px; overflow-y: auto; background: #fff;
      border: 1px solid var(--line, #e6ddce); border-radius: 10px; margin-top: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .prov-item { padding: 10px 14px; cursor: pointer; font-size: 15px; }
    .prov-item:hover, .prov-item.active { background: #fbf1e2; }
    .prov-item + .prov-item { border-top: 1px solid #f2ebdd; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="brand"><a href="/" style="color:inherit;display:flex;gap:10px;align-items:center"><span class="logo">🌿</span> BARNBARN</a></div>
    <a class="plain" href="/">◂ กลับหน้าแรก</a>
  </nav>

  <main class="wrap" id="root"><p class="muted">กำลังโหลด…</p></main>

  <div class="footer">
    <div class="fline">🌿 BARNBARN Workshop · สอบถาม / แจ้งชำระเงินได้ทาง LINE Official Account</div>
    <a class="line-btn" href="https://lin.ee/TjK2193" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg"><path d="M12 3.5c-5.24 0-9.5 3.44-9.5 7.68 0 3.8 3.38 6.98 7.94 7.58.31.06.73.2.84.46.1.24.06.6.03.84l-.13.82c-.04.24-.19.95.83.52 1.02-.43 5.5-3.24 7.5-5.55 1.38-1.52 2.04-3.07 2.04-4.79C21.5 6.94 17.24 3.5 12 3.5z"/></svg>
      เพิ่มเพื่อน LINE Official
    </a>
  </div>

  <a class="line-fab" href="https://lin.ee/TjK2193" target="_blank" rel="noopener" aria-label="เพิ่มเพื่อน LINE Official">
    <svg viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg"><path d="M12 3.5c-5.24 0-9.5 3.44-9.5 7.68 0 3.8 3.38 6.98 7.94 7.58.31.06.73.2.84.46.1.24.06.6.03.84l-.13.82c-.04.24-.19.95.83.52 1.02-.43 5.5-3.24 7.5-5.55 1.38-1.52 2.04-3.07 2.04-4.79C21.5 6.94 17.24 3.5 12 3.5z"/></svg>
    <span class="lbl">แอดไลน์</span>
  </a>

  <script>
    const qs = new URLSearchParams(location.search);
    const wsId = qs.get('id');
    const money = (n) => Number(n).toLocaleString('th-TH');
    const fmtDate = (d) => { try { return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});} catch { return d; } };
    let WS = null, CFG = null, REG = null, REG_ROUND = null, SELECTED_ADDONS = [];

    // ---------- searchable province picker (77 จังหวัด) ----------
    const PROVINCES = ["กรุงเทพมหานคร","กระบี่","กาญจนบุรี","กาฬสินธุ์","กำแพงเพชร","ขอนแก่น","จันทบุรี","ฉะเชิงเทรา","ชลบุรี","ชัยนาท","ชัยภูมิ","ชุมพร","เชียงราย","เชียงใหม่","ตรัง","ตราด","ตาก","นครนายก","นครปฐม","นครพนม","นครราชสีมา","นครศรีธรรมราช","นครสวรรค์","นนทบุรี","นราธิวาส","น่าน","บึงกาฬ","บุรีรัมย์","ปทุมธานี","ประจวบคีรีขันธ์","ปราจีนบุรี","ปัตตานี","พระนครศรีอยุธยา","พะเยา","พังงา","พัทลุง","พิจิตร","พิษณุโลก","เพชรบุรี","เพชรบูรณ์","แพร่","ภูเก็ต","มหาสารคาม","มุกดาหาร","แม่ฮ่องสอน","ยโสธร","ยะลา","ร้อยเอ็ด","ระนอง","ระยอง","ราชบุรี","ลพบุรี","ลำปาง","ลำพูน","เลย","ศรีสะเกษ","สกลนคร","สงขลา","สตูล","สมุทรปราการ","สมุทรสงคราม","สมุทรสาคร","สระแก้ว","สระบุรี","สิงห์บุรี","สุโขทัย","สุพรรณบุรี","สุราษฎร์ธานี","สุรินทร์","หนองคาย","หนองบัวลำภู","อ่างทอง","อำนาจเจริญ","อุดรธานี","อุตรดิตถ์","อุทัยธานี","อุบลราชธานี"];
    let provActive = -1;
    function filterProvince() {
      const inp = document.getElementById('province');
      const q = (inp.value || '').trim().toLowerCase();
      const list = document.getElementById('province-list');
      const matches = PROVINCES.filter(p => !q || p.toLowerCase().includes(q));
      provActive = -1;
      list.innerHTML = matches.length
        ? matches.map((p, i) => `<div class="prov-item" data-i="${i}" onmousedown="pickProvince('${p}')">${p}</div>`).join('')
        : '<div class="prov-item muted">ไม่พบจังหวัดนี้</div>';
      list.style.display = 'block';
    }
    function pickProvince(p) {
      document.getElementById('province').value = p;
      document.getElementById('province-list').style.display = 'none';
    }
    function provinceKey(e) {
      const list = document.getElementById('province-list');
      const items = [...list.querySelectorAll('.prov-item[data-i]')];
      if (!items.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); provActive = Math.min(provActive + 1, items.length - 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); provActive = Math.max(provActive - 1, 0); }
      else if (e.key === 'Enter') { if (provActive >= 0) { e.preventDefault(); pickProvince(items[provActive].textContent); } return; }
      else return;
      items.forEach((it, i) => it.classList.toggle('active', i === provActive));
      items[provActive].scrollIntoView({ block: 'nearest' });
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.prov-wrap')) {
        const l = document.getElementById('province-list');
        if (l) l.style.display = 'none';
      }
    });

    async function boot() {
      const [wRes, cRes] = await Promise.all([ fetch('/api/workshops/'+wsId), fetch('/api/config') ]);
      if (!wRes.ok) { document.getElementById('root').innerHTML = '<div class="panel">ไม่พบเวิร์กช็อปนี้ · <a href="/">กลับหน้าแรก</a></div>'; return; }
      WS = await wRes.json(); CFG = await cRes.json();
      renderStep1();
    }

    // ---------- STEP 1: เลือกรอบ ----------
    function renderStep1() {
      const rounds = WS.rounds.map(r => {
        const full = r.remaining <= 0;
        return `<div class="rowline" style="opacity:${full?.75:1}">
          <label class="k" style="cursor:${full?'not-allowed':'pointer'};display:flex;align-items:center;gap:8px">
            <input type="radio" name="round" value="${r.id}" ${full?'disabled':''} style="width:auto">
            📅 ${fmtDate(r.date)} · ${r.time}</label>
          <span class="v">${r.price>0 ? money(r.price)+' บาท' : 'ฟรี'} ${full
            ? `<span style="color:var(--danger)">· เต็ม</span> <button class="btn btn-ghost btn-sm" onclick="openWaitlist('${r.id}')">🔔 เข้าคิวสำรอง</button>`
            : `<span class="muted">· เหลือ ${r.remaining} ที่</span>`}</span>
        </div>`;
      }).join('');

      document.getElementById('root').innerHTML = `
        <div class="two-col">
          <div class="panel">
            <div class="steps">
              <div class="step active">1 · เลือกรอบ</div>
              <div class="step">2 · กรอกข้อมูล</div>
              <div class="step">3 · ชำระเงิน</div>
            </div>
            <span class="tag">${WS.category||'เวิร์กช็อป'}</span>
            <h1 style="color:var(--brown);margin:8px 0">${WS.title}</h1>
            ${WS.subtitle?`<p class="muted" style="margin-top:-6px">${WS.subtitle}</p>`:''}
            <p>${(WS.description||'').replace(/\n/g,'<br>')}</p>
            ${WS.location?`<p>📍 <b>สถานที่:</b> ${WS.location}</p>`:''}
            <h3 style="color:var(--brown)">เลือกวันและรอบ</h3>
            ${rounds}
            <div id="waitlist-area"></div>
            <div class="field mt">
              <label>จำนวนผู้เข้าร่วม</label>
              <select id="people">${[1,2,3,4,5].map(n=>`<option value="${n}">${n} ท่าน</option>`).join('')}</select>
            </div>
            ${(WS.addons && WS.addons.length) ? `
            <div class="field mt">
              <label>อุปกรณ์พิเศษ (เลือกได้ถ้าต้องการ)</label>
              ${WS.addons.map(a => `
                <label class="rowline" style="cursor:pointer">
                  <span class="k"><input type="checkbox" name="addon" value="${a.id}" style="width:auto;margin-right:8px">${a.name}</span>
                  <span class="v">+${money(a.price)} บาท</span>
                </label>`).join('')}
            </div>` : ''}
            <button class="btn btn-primary block mt" onclick="toStep2()">ถัดไป ▸</button>
          </div>
          <aside class="panel">
            <h3 style="margin-top:0;color:var(--brown)">ทำไมต้อง BARNBARN?</h3>
            <p class="muted">🌿 วิทยากรดูแลใกล้ชิด<br>🎨 อุปกรณ์ครบ ไม่ต้องเตรียม<br>🏦 โอนผ่านธนาคาร/พร้อมเพย์<br>💬 ยืนยันและสอบถามได้ทาง LINE</p>
            <div class="alert info mt">ที่นั่งมีจำนวนจำกัดต่อรอบ · ระบบจะกันที่นั่งให้เมื่อกรอกข้อมูลเสร็จ</div>
          </aside>
        </div>`;
    }

    let FORM = null, ROUNDID = null, PEOPLE = 1, INFO_STEP = 0;
    function toStep2() {
      const round = document.querySelector('input[name=round]:checked');
      if (!round) return alert('กรุณาเลือกวันและรอบก่อนค่ะ');
      ROUNDID = round.value;
      PEOPLE = Number(document.getElementById('people').value);
      const ids = [...document.querySelectorAll('input[name=addon]:checked')].map(c => c.value);
      SELECTED_ADDONS = (WS.addons || []).filter(a => ids.includes(a.id));
      if (!FORM || FORM.members.length !== PEOPLE - 1) {
        FORM = {
          rep: { name:'', nickname:'', age:'', phone:'', province:'', email:'', lineId:'', source:'' },
          members: Array.from({ length: Math.max(0, PEOPLE - 1) }, () => ({ name:'', nickname:'', age:'' })),
          health: { allergy:'', foodAvoid:'', medical:'' },
          healthHas: { allergy:null, foodAvoid:null, medical:null }, // null = ยังไม่เลือก, true = มี, false = ไม่มี
          emergency: { name:'', phone:'', relation:'' },
          note: ''
        };
      }
      renderInfo(0);
    }
    const addonsTotal = () => SELECTED_ADDONS.reduce((s, a) => s + (Number(a.price) || 0), 0);

    function openWaitlist(roundId) {
      const r = WS.rounds.find(x => x.id === roundId);
      document.getElementById('waitlist-area').innerHTML = `
        <div class="panel mt" style="box-shadow:none;border-color:var(--orange)">
          <b style="color:var(--brown)">🔔 คิวสำรอง — ${fmtDate(r.date)} ${r.time}</b>
          <p class="hint">รอบนี้เต็มแล้ว กรอกชื่อ+เบอร์ไว้ ถ้ามีคนสละสิทธิ์ ผู้จัดจะติดต่อกลับตามลำดับค่ะ</p>
          <div class="field"><input id="wl-name" placeholder="ชื่อ-นามสกุล"></div>
          <div class="field"><input id="wl-phone" inputmode="tel" placeholder="เบอร์โทรศัพท์"></div>
          <div id="wl-err"></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost" onclick="document.getElementById('waitlist-area').innerHTML=''">ยกเลิก</button>
            <button class="btn btn-primary" style="flex:1" onclick="submitWaitlist('${roundId}')">เข้าคิวสำรอง</button>
          </div>
        </div>`;
      document.getElementById('waitlist-area').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    async function submitWaitlist(roundId) {
      const name = (document.getElementById('wl-name').value || '').trim();
      const phone = (document.getElementById('wl-phone').value || '').trim();
      if (!name || phone.replace(/\D/g,'').length < 8) {
        document.getElementById('wl-err').innerHTML = '<div class="alert err">กรุณากรอกชื่อและเบอร์ให้ถูกต้อง</div>'; return;
      }
      const res = await fetch('/api/waitlist', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ workshopId: wsId, roundId, name, phone }) });
      if (res.ok) {
        document.getElementById('waitlist-area').innerHTML =
          '<div class="alert ok mt">✅ เข้าคิวสำรองเรียบร้อย! ถ้ามีที่ว่างผู้จัดจะติดต่อกลับค่ะ</div>';
      } else {
        document.getElementById('wl-err').innerHTML = '<div class="alert err">เกิดข้อผิดพลาด กรุณาลองใหม่</div>';
      }
    }

    // build "add to calendar" (Google) + map links from a round
    function calendarLink(round) {
      try {
        const [s, e] = (round.time || '').split(/[–-]/).map(t => t.trim());
        const d = round.date.replace(/-/g, '');
        const pad = (t) => (t || '').replace(':', '') + '00';
        const dates = s && e ? `${d}T${pad(s)}/${d}T${pad(e)}` : `${d}/${d}`;
        const p = new URLSearchParams({
          action: 'TEMPLATE', text: WS.title,
          dates, details: 'BARNBARN Workshop', location: WS.location || ''
        });
        return 'https://calendar.google.com/calendar/render?' + p.toString();
      } catch { return ''; }
    }
    const mapLink = () => WS.location ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(WS.location) : '';

    // ---------- STEP 2: กรอกข้อมูล (หลายหน้าตามจำนวนผู้เข้าร่วม) ----------
    const escAttr = (s) => String(s || '').replace(/"/g, '&quot;');

    function summaryAside(r, total) {
      return `<h3 style="margin-top:0;color:var(--brown)">สรุปการสมัคร</h3>
        <div class="rowline"><span class="k">เวิร์กช็อป</span><span class="v">${WS.title}</span></div>
        <div class="rowline"><span class="k">รอบ</span><span class="v">${fmtDate(r.date)}<br>${r.time}</span></div>
        <div class="rowline"><span class="k">ราคา/ท่าน</span><span class="v">${r.price>0 ? money(r.price)+' บาท' : 'ฟรี'}</span></div>
        <div class="rowline"><span class="k">จำนวน</span><span class="v">${PEOPLE} ท่าน</span></div>
        ${SELECTED_ADDONS.map(a=>`<div class="rowline"><span class="k">➕ ${a.name}</span><span class="v">+${money(a.price)} บาท</span></div>`).join('')}
        <div class="rowline"><span class="k total">ยอดรวม</span><span class="v total">${total>0 ? money(total)+' บาท' : 'ฟรี'}</span></div>`;
    }

    function repFields() {
      const d = FORM.rep;
      return `
        <div class="field"><label>ชื่อ-นามสกุล <span class="req">*</span></label><input id="f-name" value="${escAttr(d.name)}" placeholder="เช่น สมหญิง ใจดี"></div>
        <div class="two" style="display:flex;gap:10px">
          <div class="field" style="flex:1"><label>ชื่อเล่น</label><input id="f-nick" value="${escAttr(d.nickname)}" placeholder="เช่น หญิง"></div>
          <div class="field" style="width:120px"><label>อายุ <span class="req">*</span></label><input id="f-age" inputmode="numeric" value="${escAttr(d.age)}" placeholder="ปี"></div>
        </div>
        <div class="field"><label>เบอร์โทรศัพท์ <span class="req">*</span></label><input id="f-phone" inputmode="tel" value="${escAttr(d.phone)}" placeholder="08x-xxx-xxxx"></div>
        <div class="field prov-wrap">
          <label>จังหวัด <span class="req">*</span></label>
          <input id="province" autocomplete="off" value="${escAttr(d.province)}" placeholder="พิมพ์เพื่อค้นหา เช่น เชียงใหม่" oninput="filterProvince()" onfocus="filterProvince()" onkeydown="provinceKey(event)">
          <div id="province-list" class="prov-list"></div>
          <div class="hint">เลือกจังหวัดจากรายการ (พิมพ์เพื่อค้นหาได้)</div>
        </div>
        <div class="field"><label>อีเมล</label><input id="f-email" type="email" value="${escAttr(d.email)}" placeholder="you@email.com"><div class="hint">ใช้ส่งอีเมลยืนยันอัตโนมัติ (ถ้าไม่กรอก กรุณาแอดไลน์ OA เพื่อรับการยืนยัน)</div></div>
        <div class="field"><label>ชื่อบน LINE (สำหรับยืนยันผ่าน LINE OA)</label><input id="f-line" value="${escAttr(d.lineId)}" placeholder="ชื่อที่ใช้บน LINE ของคุณ"><div class="hint">จำเป็นถ้าไม่กรอกอีเมล</div></div>
        <div class="field"><label>รู้จักกิจกรรมนี้จากช่องทางไหน? <span class="req">*</span></label>
          <select id="f-source">
            ${['','เว็บไซต์','LINE Official Account','Facebook','มีคนบอกต่อ','อื่นๆ'].map(v=>`<option value="${v}" ${v===d.source?'selected':''}>${v||'— เลือกช่องทาง —'}</option>`).join('')}
          </select>
        </div>`;
    }

    function memberFields(step) {
      const d = FORM.members[step-1] || { name:'', nickname:'', age:'' };
      return `
        <p class="hint" style="margin-top:0">กรอกข้อมูลผู้เข้าร่วมคนที่ ${step+1} (ข้อมูลติดต่อใช้ของตัวแทนคนที่ 1)</p>
        <div class="field"><label>ชื่อ-นามสกุล <span class="req">*</span></label><input id="m-name" value="${escAttr(d.name)}" placeholder="ชื่อ-นามสกุล ผู้เข้าร่วมคนที่ ${step+1}"></div>
        <div class="two" style="display:flex;gap:10px">
          <div class="field" style="flex:1"><label>ชื่อเล่น</label><input id="m-nick" value="${escAttr(d.nickname)}" placeholder="ชื่อเล่น"></div>
          <div class="field" style="width:120px"><label>อายุ <span class="req">*</span></label><input id="m-age" inputmode="numeric" value="${escAttr(d.age)}" placeholder="ปี"></div>
        </div>`;
    }

    function healthRow(label, key, radioName, textId, placeholder) {
      const has = FORM.healthHas[key]; // null | true | false
      return `
        <div class="field">
          <label>${label} <span class="req">*</span></label>
          <div style="display:flex;gap:20px;margin-bottom:6px">
            <label style="font-weight:400;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="${radioName}" value="none" ${has===false?'checked':''} onchange="healthToggle('${radioName}','${textId}')" style="width:auto">ไม่มี</label>
            <label style="font-weight:400;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="${radioName}" value="yes" ${has===true?'checked':''} onchange="healthToggle('${radioName}','${textId}')" style="width:auto">มี</label>
          </div>
          <input id="${textId}" class="${has===true?'':'hidden'}" value="${escAttr(FORM.health[key])}" placeholder="${placeholder}">
        </div>`;
    }
    function healthToggle(radioName, textId) {
      const yes = document.querySelector(`input[name="${radioName}"]:checked`).value === 'yes';
      const box = document.getElementById(textId);
      box.classList.toggle('hidden', !yes);
      if (!yes) box.value = '';
    }

    function healthFields() {
      const e = FORM.emergency;
      const hintPerson = PEOPLE > 1 ? ' (ถ้าเจาะจงคน ระบุชื่อด้วย เช่น สมชาย: กุ้ง)' : '';
      return `
        <p class="hint" style="margin-top:0">ข้อมูลด้านล่างกรอกรวมครั้งเดียวสำหรับทุกคน${PEOPLE>1?' — โปรดระบุชื่อคนถ้าเจาะจงเฉพาะบางคน':''}</p>
        ${healthRow('การแพ้อาหาร','allergy','allergy-has','h-allergy','ระบุอาหารที่แพ้ เช่น กุ้ง ถั่ว นม'+hintPerson)}
        ${healthRow('อาหารที่ไม่รับประทาน','foodAvoid','food-has','h-food','เช่น เนื้อวัว หมู อาหารเจ/มังสวิรัติ'+hintPerson)}
        ${healthRow('โรคประจำตัว','medical','medical-has','h-medical','ระบุโรคประจำตัว เช่น หอบหืด ภูมิแพ้'+hintPerson)}
        <hr style="border:none;border-top:1px dashed var(--line);margin:14px 0">
        <h3 style="color:var(--brown);margin:0 0 6px">ผู้ติดต่อฉุกเฉิน <span class="req">*</span></h3>
        <div class="field"><label>ชื่อผู้ติดต่อฉุกเฉิน <span class="req">*</span></label><input id="e-name" value="${escAttr(e.name)}" placeholder="ชื่อ-นามสกุล ผู้ติดต่อได้กรณีฉุกเฉิน"></div>
        <div class="two" style="display:flex;gap:10px">
          <div class="field" style="flex:1"><label>เบอร์ติดต่อฉุกเฉิน <span class="req">*</span></label><input id="e-phone" inputmode="tel" value="${escAttr(e.phone)}" placeholder="08x-xxx-xxxx"></div>
          <div class="field" style="flex:1"><label>ความสัมพันธ์ <span class="req">*</span></label><input id="e-rel" value="${escAttr(e.relation)}" placeholder="เช่น พ่อ แม่ พี่ เพื่อน"></div>
        </div>
        <div class="field"><label>หมายเหตุถึงผู้จัด</label><textarea id="f-note" placeholder="คำถามอื่น ๆ">${escAttr(FORM.note)}</textarea></div>`;
    }

    function renderInfo(step) {
      INFO_STEP = step;
      const r = WS.rounds.find(x => x.id === ROUNDID);
      const total = r.price * PEOPLE + addonsTotal();
      const isLast = step === PEOPLE;
      let heading, progress, body;
      if (step < PEOPLE) {
        if (step === 0) { heading = 'ข้อมูลผู้สมัคร (ตัวแทน)'; body = repFields(); }
        else { heading = `ผู้เข้าร่วมคนที่ ${step+1}`; body = memberFields(step); }
        progress = `👥 ${step+1}/${PEOPLE}`;
      } else { heading = 'ข้อมูลสุขภาพ & ผู้ติดต่อฉุกเฉิน'; progress = 'ขั้นสุดท้าย'; body = healthFields(); }
      const nextLabel = isLast ? (total>0 ? 'ยืนยัน & ไปชำระเงิน ▸' : 'ยืนยันการสมัคร (ฟรี) ▸') : 'ถัดไป ▸';
      document.getElementById('root').innerHTML = `
        <div class="two-col">
          <div class="panel">
            <div class="steps">
              <div class="step done">1 · เลือกรอบ</div>
              <div class="step active">2 · กรอกข้อมูล</div>
              <div class="step">3 · ชำระเงิน</div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px">
              <h2 style="color:var(--brown);margin:0;font-size:20px">${heading}</h2>
              <span class="muted" style="font-weight:700">${progress}</span>
            </div>
            <div id="err"></div>
            ${body}
            <div style="display:flex;gap:10px;margin-top:12px">
              <button class="btn btn-ghost" onclick="infoBack()">◂ ย้อนกลับ</button>
              <button class="btn btn-primary" style="flex:1" onclick="infoNext()">${nextLabel}</button>
            </div>
          </div>
          <aside class="panel">${summaryAside(r, total)}</aside>
        </div>`;
      window.scrollTo(0, 0);
    }

    function saveInfo(step) {
      if (step < PEOPLE) {
        if (step === 0) {
          FORM.rep = { name: val('f-name'), nickname: val('f-nick'), age: val('f-age'), phone: val('f-phone'),
                       province: val('province'), email: val('f-email'), lineId: val('f-line'), source: val('f-source') };
        } else {
          FORM.members[step-1] = { name: val('m-name'), nickname: val('m-nick'), age: val('m-age') };
        }
      } else {
        const pick = (radioName) => document.querySelector(`input[name="${radioName}"]:checked`)?.value ?? null; // 'yes' | 'none' | null
        const rec = (radioName, key, textId) => {
          const v = pick(radioName);
          FORM.healthHas[key] = v == null ? null : (v === 'yes');
          FORM.health[key] = v === 'yes' ? val(textId) : '';
        };
        rec('allergy-has','allergy','h-allergy'); rec('food-has','foodAvoid','h-food'); rec('medical-has','medical','h-medical');
        FORM.emergency = { name: val('e-name'), phone: val('e-phone'), relation: val('e-rel') };
        FORM.note = val('f-note');
      }
    }

    function validateInfo(step) {
      if (step === 0) {
        const d = FORM.rep;
        if (!d.name) return 'กรุณากรอกชื่อ-นามสกุล';
        if (!d.age) return 'กรุณากรอกอายุ';
        if (d.phone.replace(/\D/g,'').length < 8) return 'กรุณากรอกเบอร์โทรให้ถูกต้อง';
        if (!PROVINCES.includes(d.province)) return 'กรุณาเลือกจังหวัดจากรายการ';
        if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return 'รูปแบบอีเมลไม่ถูกต้อง';
        if (!d.email && !d.lineId) return 'กรุณากรอกอีเมล หรือ ชื่อ LINE อย่างน้อย 1 อย่าง';
        if (!d.source) return 'กรุณาเลือกช่องทางที่รู้จักกิจกรรมนี้';
      } else if (step < PEOPLE) {
        const m = FORM.members[step-1];
        if (!m.name) return `กรุณากรอกชื่อผู้เข้าร่วมคนที่ ${step+1}`;
        if (!m.age) return `กรุณากรอกอายุผู้เข้าร่วมคนที่ ${step+1}`;
      } else {
        const pick = (radioName) => document.querySelector(`input[name="${radioName}"]:checked`)?.value ?? null;
        if (!pick('allergy-has')) return 'กรุณาเลือกว่า “มี” หรือ “ไม่มี” การแพ้อาหาร';
        if (pick('allergy-has') === 'yes' && !val('h-allergy')) return 'กรุณาระบุอาหารที่แพ้ หรือเลือก “ไม่มี”';
        if (!pick('food-has')) return 'กรุณาเลือกว่า “มี” หรือ “ไม่มี” อาหารที่ไม่รับประทาน';
        if (pick('food-has') === 'yes' && !val('h-food')) return 'กรุณาระบุอาหารที่ไม่รับประทาน หรือเลือก “ไม่มี”';
        if (!pick('medical-has')) return 'กรุณาเลือกว่า “มี” หรือ “ไม่มี” โรคประจำตัว';
        if (pick('medical-has') === 'yes' && !val('h-medical')) return 'กรุณาระบุโรคประจำตัว หรือเลือก “ไม่มี”';
        const e = FORM.emergency;
        if (!e.name || e.phone.replace(/\D/g,'').length < 8 || !e.relation) return 'กรุณากรอกข้อมูลผู้ติดต่อฉุกเฉินให้ครบ (ชื่อ เบอร์ ความสัมพันธ์)';
      }
      return '';
    }

    function infoBack() {
      saveInfo(INFO_STEP);
      if (INFO_STEP === 0) { renderStep1(); return; }
      renderInfo(INFO_STEP - 1);
    }
    function infoNext() {
      saveInfo(INFO_STEP);
      const err = validateInfo(INFO_STEP);
      if (err) { showErr(err); return; }
      if (INFO_STEP === PEOPLE) { submitReg(); return; }
      renderInfo(INFO_STEP + 1);
    }

    async function submitReg() {
      const d = FORM.rep;
      const body = {
        workshopId: wsId, roundId: ROUNDID, people: PEOPLE,
        name: d.name, phone: d.phone, email: d.email, lineId: d.lineId,
        province: d.province, source: d.source, nickname: d.nickname, age: d.age,
        allergy: FORM.health.allergy, foodAvoid: FORM.health.foodAvoid, medical: FORM.health.medical,
        emergencyName: FORM.emergency.name, emergencyPhone: FORM.emergency.phone, emergencyRelation: FORM.emergency.relation,
        members: FORM.members,
        addonIds: SELECTED_ADDONS.map(a => a.id),
        note: FORM.note
      };
      const res = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) { showErr(data.error || 'เกิดข้อผิดพลาด'); return; }
      REG = data.registration;
      REG_ROUND = data.round;
      if (Number(REG.amount) <= 0) { freeSuccessView(); return; }  // กิจกรรมฟรี — ข้ามหน้าชำระเงิน/QR
      renderStep3(data.round);
    }

    // ---------- STEP 3: ชำระเงิน (โอนผ่านธนาคาร + แนบสลิป) ----------
    let SLIP = ''; // base64 data URL of uploaded slip
    async function renderStep3(round) {
      REG_ROUND = round;
      document.getElementById('root').innerHTML = `
        <div class="two-col">
          <div class="panel">
            <div class="steps">
              <div class="step done">1 · เลือกรอบ</div>
              <div class="step done">2 · กรอกข้อมูล</div>
              <div class="step active">3 · ชำระเงิน</div>
            </div>
            <h2 style="color:var(--brown)">ชำระเงินโดยโอนผ่านธนาคาร</h2>
            <div class="alert warn">⏰ กรุณาโอนและแนบสลิปภายใน <b>${CFG.holdHours||24} ชั่วโมง</b> มิฉะนั้นที่นั่งจะถูกปล่อยคืนให้ผู้อื่นโดยอัตโนมัติ</div>
            <div id="pay-area"><p class="muted">กำลังโหลดข้อมูลการชำระเงิน…</p></div>
          </div>
          <aside class="panel">
            <h3 style="margin-top:0;color:var(--brown)">สรุปคำสั่งซื้อ</h3>
            <div class="rowline"><span class="k">รหัสอ้างอิง</span><span class="v">${REG.id}</span></div>
            <div class="rowline"><span class="k">เวิร์กช็อป</span><span class="v">${WS.title}</span></div>
            <div class="rowline"><span class="k">รอบ</span><span class="v">${fmtDate(round.date)} ${round.time}</span></div>
            <div class="rowline"><span class="k">ผู้สมัคร</span><span class="v">${REG.name}</span></div>
            ${(REG.addons||[]).map(a=>`<div class="rowline"><span class="k">➕ ${a.name}</span><span class="v">+${money(a.price)} บาท</span></div>`).join('')}
            <div class="rowline"><span class="k total">ยอดที่ต้องโอน</span><span class="v total">${money(REG.amount)} บาท</span></div>
          </aside>
        </div>`;
      const info = await (await fetch('/api/payment-info')).json();
      const area = document.getElementById('pay-area');
      if (!info.configured) {
        area.innerHTML = `<div class="alert warn">ผู้จัดยังไม่ได้ตั้งค่าช่องทางการชำระเงิน กรุณาติดต่อผู้จัดทาง LINE
          เพื่อแจ้งรหัสอ้างอิง <b>${REG.id}</b> และสอบถามวิธีชำระเงินค่ะ</div>
          ${CFG.lineAddFriendUrl ? `<a class="btn btn-blue block mt" href="${CFG.lineAddFriendUrl}" target="_blank">➕ เพิ่มเพื่อน LINE ผู้จัด</a>` : ''}`;
        return;
      }
      const acc = info.accountNumber
        ? `<div class="rowline"><span class="k">ธนาคาร</span><span class="v">${info.bankName||'-'}</span></div>
           <div class="rowline"><span class="k">ชื่อบัญชี</span><span class="v">${info.accountName||'-'}</span></div>
           <div class="rowline"><span class="k">เลขบัญชี</span><span class="v">${info.accountNumber} <button class="btn btn-ghost btn-sm" onclick="copyText('${info.accountNumber}')">คัดลอก</button></span></div>`
        : '';
      area.innerHTML = `
        <div class="alert info">โอนตามยอด <b>${money(REG.amount)} บาท</b> แล้วแนบสลิปด้านล่าง ผู้จัดจะตรวจสอบและยืนยันให้ค่ะ</div>
        ${info.paymentQr ? `<div class="qrbox">
            <p style="margin-top:0"><b>สแกน / บันทึก QR เพื่อโอนเงิน</b></p>
            <img src="${info.paymentQr}" alt="QR ชำระเงิน" id="payqr">
            <div class="mt"><a class="btn btn-yellow btn-sm" href="${info.paymentQr}" download="barnbarn-payment-qr.png">⬇️ ดาวน์โหลด QR</a></div>
          </div>` : ''}
        ${acc ? `<div class="panel mt" style="box-shadow:none">${acc}</div>` : ''}
        ${info.note ? `<p class="hint">${info.note.replace(/\n/g,'<br>')}</p>` : ''}
        <hr style="border:none;border-top:1px dashed var(--line);margin:18px 0">
        <h3 style="color:var(--brown)">แนบสลิปการโอนเงิน</h3>
        <div class="field">
          <input type="file" id="slip" accept="image/*" onchange="onSlip(event)">
          <div class="hint">ถ่ายรูปหรือแคปหน้าจอสลิปโอนเงิน แล้วเลือกไฟล์</div>
        </div>
        <div id="slip-preview"></div>
        <div id="notify-err"></div>
        <button class="btn btn-primary block mt" id="notify-btn" onclick="notifyPaid()">✅ แจ้งชำระเงินแล้ว</button>`;
    }

    // resize + read an image file to a compact base64 data URL
    function fileToResizedDataURL(file, maxW = 900, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function onSlip(e) {
      const f = e.target.files[0];
      if (!f) return;
      SLIP = await fileToResizedDataURL(f);
      document.getElementById('slip-preview').innerHTML =
        `<img src="${SLIP}" style="max-height:200px;border-radius:10px;border:1px solid var(--line)"><p class="hint">แนบสลิปเรียบร้อย ✓</p>`;
    }

    function copyText(t) { navigator.clipboard?.writeText(t); }

    async function notifyPaid() {
      if (!SLIP) { document.getElementById('notify-err').innerHTML = '<div class="alert err">กรุณาแนบสลิปการโอนเงินก่อนค่ะ</div>'; return; }
      const btn = document.getElementById('notify-btn');
      btn.disabled = true; btn.textContent = 'กำลังส่ง…';
      const res = await fetch(`/api/register/${REG.id}/notify-paid`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slipImage: SLIP })
      });
      if (!res.ok) { btn.disabled = false; btn.textContent = '✅ แจ้งชำระเงินแล้ว';
        document.getElementById('notify-err').innerHTML = '<div class="alert err">เกิดข้อผิดพลาด กรุณาลองใหม่</div>'; return; }
      successView();
    }

    function successView() {
      const addFriend = CFG.lineAddFriendUrl
        ? `<a class="btn btn-blue block mt" href="${CFG.lineAddFriendUrl}" target="_blank">➕ เพิ่มเพื่อน LINE เพื่อรับการยืนยัน</a>`
        : '';
      document.getElementById('root').innerHTML = `
        <div class="panel center" style="max-width:560px;margin:0 auto">
          <div style="font-size:64px">📩</div>
          <h1 style="color:var(--green)">แจ้งชำระเงินเรียบร้อย!</h1>
          <p>ขอบคุณค่ะ ${REG.name} 🌿 เราได้รับสลิปของคุณแล้ว</p>
          <div class="alert info">รหัสอ้างอิง: <b>${REG.id}</b><br>
            ผู้จัดกำลังตรวจสอบการชำระเงิน และจะส่งข้อความยืนยันที่นั่งให้คุณเร็ว ๆ นี้ค่ะ
            ${CFG.lineAddFriendUrl ? 'กรุณาเพิ่มเพื่อน LINE เพื่อรับการยืนยัน' : ''}</div>
          ${addFriend}
          ${REG_ROUND ? `<a class="btn btn-blue block mt" href="${calendarLink(REG_ROUND)}" target="_blank" rel="noopener">📅 เพิ่มลงปฏิทิน (กันลืมวัน)</a>` : ''}
          ${mapLink() ? `<a class="btn btn-ghost block mt" href="${mapLink()}" target="_blank" rel="noopener">📍 ดูแผนที่สถานที่</a>` : ''}
          <a class="btn btn-yellow block mt" href="/my?phone=${encodeURIComponent(REG.phone||'')}">📋 ดูการสมัครของฉัน</a>
          <a class="btn btn-ghost block mt" href="/">กลับหน้าแรก</a>
        </div>`;
    }

    // กิจกรรมฟรี — ยืนยันการสมัครทันที ไม่มีขั้นตอนชำระเงิน
    function freeSuccessView() {
      const addFriend = CFG.lineAddFriendUrl
        ? `<a class="btn btn-blue block mt" href="${CFG.lineAddFriendUrl}" target="_blank">➕ เพิ่มเพื่อน LINE Official</a>`
        : '';
      document.getElementById('root').innerHTML = `
        <div class="panel center" style="max-width:560px;margin:0 auto">
          <div style="font-size:64px">🎉</div>
          <h1 style="color:var(--green)">สมัครสำเร็จ!</h1>
          <p>ขอบคุณค่ะ ${REG.name} 🌿 กิจกรรมนี้ <b>ฟรี ไม่มีค่าใช้จ่าย</b> — ที่นั่งของคุณได้รับการยืนยันเรียบร้อยแล้ว</p>
          <div class="alert ok">รหัสอ้างอิง: <b>${REG.id}</b><br>
            ${REG.email ? 'เราได้ส่งอีเมลยืนยันการสมัครให้คุณแล้ว 📧' : 'กรุณาเพิ่มเพื่อน LINE OA ของเราไว้รับข่าวสารและรายละเอียดกิจกรรม'}</div>
          ${addFriend}
          ${REG_ROUND ? `<a class="btn btn-blue block mt" href="${calendarLink(REG_ROUND)}" target="_blank" rel="noopener">📅 เพิ่มลงปฏิทิน (กันลืมวัน)</a>` : ''}
          ${mapLink() ? `<a class="btn btn-ghost block mt" href="${mapLink()}" target="_blank" rel="noopener">📍 ดูแผนที่สถานที่</a>` : ''}
          <a class="btn btn-yellow block mt" href="/my?phone=${encodeURIComponent(REG.phone||'')}">📋 ดูการสมัครของฉัน</a>
          <a class="btn btn-ghost block mt" href="/">กลับหน้าแรก</a>
        </div>`;
    }

    const val = (id) => (document.getElementById(id)?.value || '').trim();
    const showErr = (m) => { const e = document.getElementById('err'); if (e) e.innerHTML = `<div class="alert err">${m}</div>`; };
    boot();
  </script>
</body>
</html>
